<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ocean preview</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  /* 開発用。diveセクション1枚だけを固定サイズで出して見た目を詰める。
     ビューポート依存にすると、非表示のプレビューペインで寸法が0になり
     測り間違える（実機とは無関係の事故） */
  body { margin:0; background:#02273B; }
  .dive { width:1280px; height:720px; min-height:0; }
  .dive.sp { width:390px; height:700px; }
</style>
</head>
<body>
<section id="dive" class="dive" aria-labelledby="dive-title" data-ocean>
  <div class="dive-surface" aria-hidden="true"></div>
  <div class="dive-inner">
    <span class="dive-label">Under the surface</span>
    <h2 id="dive-title">水面の下は、<br class="sp-only">こんな世界です。</h2>
    <p class="dive-lead">
      浜から数十メートル。器材を背負って沈むと、光の筋がゆれて、群れが目の前を横切ります。<br>
      三浦の海は、そういう場所です。
    </p>
    <div class="dive-buttons">
      <a href="#" class="btn btn--coral">まずは体験ダイビング</a>
      <a href="#" class="btn btn--ghost">海の生き物図鑑を見る</a>
    </div>
    <p class="dive-note" data-ocean-note>この背景はお使いの端末のGPUでリアルタイムに描いています</p>
  </div>
</section>

<script type="module">
  /* プレビュー用パラメータ:
     ?frames=N   起動後にNフレームぶん手動で進めてから止める（rAFの回らない環境用）
     ?webgl=1    WebGL2フォールバック経路を強制して見比べる
  */
  const q = new URLSearchParams(location.search);
  const el = document.querySelector('[data-ocean]');
  if (q.get('sp')) el.classList.add('sp');
  const mod = await import('/js/ocean/ocean.min.js?v=' + Date.now());
  const o = await mod.start({
    hero: el,
    webgpu: q.get('webgl') ? false : !!navigator.gpu,
    cores: 8,
    memory: 16,
  });

  const canvas = document.querySelector('.ocean-canvas');
  canvas.style.transition = 'none';
  canvas.classList.add('is-live');

  const frames = parseInt(q.get('frames') || '0', 10);
  if (frames > 0) {
    const dt = 1 / 60;
    for (let i = 0; i < frames; i++) {
      o.shared.uTime.value += dt;
      o.shared.uDelta.value = dt;
      o.school.tickFrame(i);
      if (o.compute) o.renderer.compute(o.school.computeStep);
      // 最後の1枚だけ完了を待つ。待たないと画面に出る前に採取してしまう
      if (i === frames - 1) await o.renderer.renderAsync(o.scene, o.camera);
      else o.renderer.render(o.scene, o.camera);
    }
  }
  window.__ready = true;
</script>
</body>
</html>
